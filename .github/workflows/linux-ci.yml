# SPDX-License-Identifier: GPL-3.0-or-later

name: Linux CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build And Test On Linux
    runs-on: ubuntu-22.04

    steps:
      - name: Check Out Repository
        uses: actions/checkout@v4

      - name: Check SPDX Headers
        shell: pwsh
        run: scripts/check-spdx.ps1

      - name: Check Architecture Boundaries
        shell: pwsh
        run: scripts/check-architecture-boundaries.ps1

      - name: Check Implementation Placement
        shell: pwsh
        run: scripts/check-implementation-placement.ps1

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            appstream \
            autopkgtest \
            build-essential \
            cmake \
            debhelper \
            desktop-file-utils \
            g++ \
            lintian \
            ninja-build \
            libfreetype6-dev \
            libmpg123-dev \
            libsoxr-dev \
            ffmpeg \
            libwayland-bin \
            libwayland-dev \
            wayland-protocols \
            libxkbcommon-dev \
            libx11-dev \
            pkgconf

      - name: Configure Shared Linux Tests
        run: cmake --preset linux-test-debug

      - name: Build Shared Linux Tests
        run: cmake --build --preset linux-test-debug-build

      - name: Verify Default Linux WebUI Test Coverage
        run: |
          ctest --test-dir build/test -N | tee /tmp/lofibox-linux-tests.txt
          grep -F "lofibox_webui_smoke" /tmp/lofibox-linux-tests.txt

      - name: Run Shared Linux Tests
        run: ctest --preset linux-debug-test

      - name: Configure Linux Install Skeleton
        run: >
          cmake -S . -B build/install-skeleton -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DLOFIBOX_BUILD_DEVICE=OFF
          -DLOFIBOX_BUILD_X11=OFF
          -DLOFIBOX_BUILD_WAYLAND=OFF
          -DBUILD_TESTING=OFF

      - name: Build Linux Install Skeleton Binaries
        run: cmake --build build/install-skeleton --target lofibox_zero_tui_bin lofibox_mp3_decoder

      - name: Validate Desktop Metadata
        run: |
          desktop-file-validate data/io.github.vicliu624.lofibox.desktop
          appstreamcli validate --no-net data/io.github.vicliu624.lofibox.metainfo.xml

      - name: Validate Install Skeleton
        run: |
          cmake --install build/install-skeleton --prefix "$PWD/.tmp/install-root"
          test -x .tmp/install-root/bin/lofibox-tui
          test -f .tmp/install-root/share/applications/io.github.vicliu624.lofibox.desktop
          test -f .tmp/install-root/share/metainfo/io.github.vicliu624.lofibox.metainfo.xml
          test -f .tmp/install-root/share/icons/hicolor/scalable/apps/io.github.vicliu624.lofibox.svg
          test -f .tmp/install-root/share/icons/hicolor/64x64/apps/io.github.vicliu624.lofibox.png
          test -f .tmp/install-root/share/icons/hicolor/180x180/apps/io.github.vicliu624.lofibox.png
          test -f .tmp/install-root/share/mime/packages/io.github.vicliu624.lofibox.xml
          test -f .tmp/install-root/share/man/man1/lofibox.1
          test -f .tmp/install-root/share/doc/lofibox/architecture.md

      - name: Configure Linux Device Target
        run: cmake --preset cardputer-release -DBUILD_TESTING=ON

      - name: Build Linux Device Target
        run: >
          cmake --build build/cardputer --parallel 2 --target lofibox_zero_device
          lofibox_framebuffer_blitter_smoke lofibox_frame_deadline_smoke
          lofibox_framebuffer_backlight_smoke lofibox_linux_evdev_keyboard_smoke
          lofibox_cardputer_applaunch_metadata_smoke

      - name: Test Cardputer Presentation
        run: >
          ctest --test-dir build/cardputer --output-on-failure
          -R 'lofibox_(framebuffer_blitter|framebuffer_backlight|frame_deadline|linux_evdev_keyboard|cardputer_applaunch_metadata)_smoke'

      - name: Configure Linux Wayland Target
        run: cmake --preset debian-wayland-release

      - name: Build Linux Wayland Target
        run: cmake --build --preset debian-wayland-release-build --parallel 2

      - name: Build Debian Package
        run: |
          sudo apt-get build-dep -y .
          dpkg-checkbuilddeps
          dpkg-buildpackage -us -uc -b

      - name: Resolve Debian Package Artifacts
        run: |
          deb_version="$(dpkg-parsechangelog -S Version)"
          deb_arch="$(dpkg --print-architecture)"
          echo "DEB_PACKAGE=../lofibox_${deb_version}_${deb_arch}.deb" >> "$GITHUB_ENV"
          echo "DEB_CHANGES=../lofibox_${deb_version}_${deb_arch}.changes" >> "$GITHUB_ENV"

      - name: Verify Debian Package ABI Baseline
        run: |
          test -f "$DEB_PACKAGE"
          dpkg-deb -c "$DEB_PACKAGE" | tee /tmp/lofibox-package-contents.txt
          grep -F "./usr/bin/lofibox-wayland" /tmp/lofibox-package-contents.txt
          if grep -E 'lofibox_zero_device|APPLaunch|/lofibox-x11' /tmp/lofibox-package-contents.txt; then
            echo "ERROR: Debian artifact must contain only the Wayland display backend."
            exit 1
          fi
          dpkg-deb -f "$DEB_PACKAGE" Depends
          dpkg-deb -f "$DEB_PACKAGE" Depends | tee /tmp/lofibox-depends.txt
          if grep -E 'libc6 \(>= 2\.(3[8-9]|[4-9][0-9])' /tmp/lofibox-depends.txt; then
            echo "ERROR: Package requires too new glibc. Build on an older baseline."
            exit 1
          fi

      - name: Run Lintian
        run: |
          test -f "$DEB_CHANGES"
          lintian "$DEB_CHANGES"

      - name: Run Autopkgtest Smoke
        run: |
          test -f "$DEB_CHANGES"
          sudo autopkgtest "$DEB_CHANGES" -- null

      - name: Build Cardputer Framebuffer Package
        env:
          DEB_BUILD_OPTIONS: parallel=2
        run: dpkg-buildpackage -us -uc -b -Ppkg.lofibox.cardputer

      - name: Verify And Test Cardputer Package
        run: |
          deb_version="$(dpkg-parsechangelog -S Version)"
          deb_arch="$(dpkg --print-architecture)"
          cardputer_package="../lofibox-cardputer-zero_${deb_version}_${deb_arch}.deb"
          dpkg-deb -c "$cardputer_package" > /tmp/lofibox-cardputer-contents.txt
          grep -F './usr/lib/lofibox-cardputer-zero/lofibox_zero_device' /tmp/lofibox-cardputer-contents.txt
          grep -F './usr/lib/lofibox-cardputer-zero/lofibox-applaunch' /tmp/lofibox-cardputer-contents.txt
          if grep -E '/lofibox-wayland|/lofibox-x11' /tmp/lofibox-cardputer-contents.txt; then
            echo "ERROR: Cardputer artifact must contain only the framebuffer display backend."
            exit 1
          fi
          sudo apt-get install -y "$cardputer_package"
          debian/tests/smoke
